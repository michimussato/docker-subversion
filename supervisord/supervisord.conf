# https://linuxvox.com/blog/linux-supervisorctl/
# https://blog.turret.io/basic-supervisor-logging-with-docker/

[supervisord]
nodaemon = true
pidfile = /var/run/supervisord.pid
# childlogdir=/var/log/supervisor
logfile = /var/log/supervisord.log
loglevel = debug

# [program:sshd]
# redirect_stderr = true
# environment=
# 	SSHD_OPTS=""
# command = /usr/sbin/sshd -D %(ENV_SSHD_OPTS)s

[program:svnserve]
priority = 2
redirect_stderr = true
user = apache
command = /usr/bin/svnserve --daemon --foreground --root %(ENV_SVN_BASE)s --listen-port 3690 --config-file=/etc/subversion/svnserve.conf

[program:httpd]
priority = 1
redirect_stderr = true
command = /usr/sbin/httpd -D FOREGROUND
