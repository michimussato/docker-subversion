services:
  iaean-docker-subversion:
    image: docker.io/iaean/subversion
#    build:
#      context: .
#      dockerfile: ./Dockerfile
    restart: always
    container_name: 'subversion'
    working_dir: '/data/svn'
    environment:
      # SVN_LOCAL_ADMIN_USER and SVN_LOCAL_ADMIN_PASS
      # can be enabled if there is no pre-existing .htpasswd
      # SVN_LOCAL_ADMIN_USER: admin
      # SVN_LOCAL_ADMIN_PASS: pass
      SUBVERSION_REPOS: azura/engine;azura/game;azura/raw
    ports:
      - "80:80"
      - "3690:3690"
    volumes:
      - ../../.volumes/svn/iaean-docker-subversion/repos_iaean:/data/svn:rw
#      - ../../.volumes/svn/iaean-docker-subversion/repos_iaean/.htpasswd:/data/svn/.htpasswd:ro
#      - ../../.volumes/svn/iaean-docker-subversion/repos_iaean/.svn.access:/data/svn/.svn.access:ro
#      - ../../.volumes/svn/iaean-docker-subversion/repos_iaean/.svn.sasldb:/data/svn/.svn.sasldb:ro
      - ../../.volumes/svn/iaean-docker-subversion/etc/subversion/svnserve.conf:/etc/subversion/svnserve.conf:ro
